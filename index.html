:root{--asphalt:#1c1c1c;--ink:#131314;--red:#dc1a21;--red-hi:#f0343b;--off:#e2e5d4;--g1:#303132;--g2:#4d4c4c;--g3:#9ea5a8;--ok:#3ecf8e;--card:#1a1a1b;
--display:"Komu A","Arial Narrow",Impact,sans-serif;--body:"Avenir","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;--gutter:clamp(16px,4vw,32px)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{background:var(--ink);color:var(--off);font-family:var(--body);line-height:1.45;min-height:100vh;padding-bottom:80px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:var(--gutter)}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.04em;line-height:1}
/* header */
.top{position:sticky;top:0;z-index:30;overflow:hidden;background:rgba(19,19,20,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--g1)}
.top::after{content:"";position:absolute;right:0;top:0;width:170px;height:100%;background:repeating-conic-gradient(var(--red) 0 25%,transparent 0 50%) 0 0/34px 34px;transform:skewX(-32deg);transform-origin:top right;-webkit-mask-image:linear-gradient(90deg,transparent,#000 85%);mask-image:linear-gradient(90deg,transparent,#000 85%);opacity:.55;pointer-events:none}
.bar{display:flex;align-items:center;gap:14px;padding-block:12px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand svg{width:52px;height:auto}
.brand b{font-family:var(--display);font-size:1.5rem;letter-spacing:.14em;font-weight:400}
.brand small{display:block;font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--g3);margin-top:2px}
.msel{display:flex;align-items:center;gap:6px;background:var(--asphalt);border:1px solid var(--g1);border-radius:12px;padding:4px}
.msel button{width:38px;height:38px;border:0;background:none;border-radius:8px;font-size:1.2rem}
.msel button:hover{background:var(--g1)}
.msel span{min-width:112px;white-space:nowrap;text-align:center;font-weight:800;font-size:.92rem;text-transform:capitalize}
.tabs{display:flex;gap:6px;padding-bottom:10px;position:relative;z-index:1}
.tabs button{flex:1;padding:12px 10px;border:1px solid var(--g1);background:var(--asphalt);border-radius:12px;font-family:var(--display);font-size:1.15rem;letter-spacing:.1em;text-transform:uppercase;color:var(--g3);transition:.2s}
.tabs button[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
.demo{background:rgba(220,26,33,.14);border-bottom:1px solid rgba(220,26,33,.5);padding:8px var(--gutter);font-size:.84rem;text-align:center}
.demo button{background:none;border:0;color:var(--red-hi);text-decoration:underline;font-weight:800;margin-left:6px}
/* layout */
main{padding-block:22px}
.sec{margin-bottom:30px}
.sec>h2{font-size:1.7rem;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.sec>h2::before{content:"";width:30px;height:4px;background:var(--red)}
.sec>h2 .sp{margin-left:auto}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.two{grid-template-columns:1fr}
@media(min-width:900px){.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--g1);border-radius:16px;padding:18px}

  // ---------- datos de ejemplo ----------
  function seedDemo() {

    for (var i = 0; i < 48; i++) d.clients.push({ id: "c" + i, name: fn[i % fn.length] + " " + ln[(i * 5 + Math.floor(i / 16)) % ln.length], phone: "11 " + (4000 + Math.floor(rnd() * 5999)) + "-" + (1000 + Math.floor(rnd() * 8999)), vehicle: cars[i % cars.length], plate: "", notes: "" });
    var weights = [["Lavado premium", 6], ["Limpieza de interior y lavado", 3], ["Preventa", 2], ["Abrillantado", 1], ["Lavado de motor", 1], ["Tratamiento cerámico", 1], ["Tratamiento acrílico", 1], ["Polarizado", 1], ["Promo interior y lavado", 2]];
    var pool = []; weights.forEach(function (w) { for (var i = 0; i < w[1]; i++) pool.push(w[0]); });
    var t0 = today(), start = addDays(t0, -150), day = start, n = 0;
    while (day <= t0) {
      var dw = new Date(day + "T12:00:00").getDay();
      if (dw !== 0) { var k = dw === 6 ? 1 : (rnd() < .55 ? 2 : 1); if (rnd() < .18) k = 0; for (var j = 0; j < k; j++) {
        var ci = Math.floor(rnd() * d.clients.length), svc = pick(pool), veh = rnd() < .45 ? "camioneta" : "auto", amt = priceOf(svc, veh);
        var ing = { id: "i" + (n++), date: day, cid: d.clients[ci].id, veh: veh, service: svc, amount: amt, pago: pick(["Efectivo", "Transferencia", "Transferencia", "Mercado Pago", "Tarjeta"]), nota: "" };
        d.ingresos.push(ing);
        if (daysBetween(day, t0) <= 45) { (RULES[svc] || DEF_RULE).forEach(function (rr) { d.follow.push({ id: "f" + (n++), cid: ing.cid, iid: ing.id, type: rr[1], due: addDays(day, rr[0]), done: addDays(day, rr[0]) < addDays(t0, -4) }); }); }
      } }
      day = addDays(day, 1);
    }
    var m0 = addM(curM(), -5);
    d.gastos.push({ id: "gday", type: "variable", concept: "Café, agua y limpieza del taller", amount: 2500, date: m0 + "-01", freq: "day", rec: true, end: "" });
    d.gastos.push({ id: "gweek", type: "variable", concept: "Lavado de paños y uniformes", amount: 18000, date: m0 + "-02", freq: "week", rec: true, end: "" });
    [["fijo", "Alquiler", 650000], ["fijo", "Luz y gas", 120000], ["fijo", "Internet", 30000], ["fijo", "Contador e impuestos", 95000], ["sueldo", "Sueldo operario 1", 520000], ["sueldo", "Sueldo operario 2", 480000]].forEach(function (x, i) { d.gastos.push({ id: "g" + i, type: x[0], concept: x[1], amount: x[2], date: m0 + "-01", rec: true, end: "" }); });
    for (var q = -5; q <= 0; q++) { var mm = addM(curM(), q); [["Productos de limpieza", 140000 + Math.floor(rnd() * 60000)], ["Cerámico y acrílicos", 90000 + Math.floor(rnd() * 120000)], ["Insumos", 40000 + Math.floor(rnd() * 30000)]].forEach(function (x, i) { d.gastos.push({ id: "v" + q + i, type: "variable", concept: x[0], amount: x[1], date: mm + "-" + pad(5 + i * 7), rec: false, end: "" }); }); }
    d.ingresos.push({ id: "iusd", date: addDays(t0, -3), cid: d.clients[2].id, veh: "camioneta", service: "Tratamiento cerámico", amount: 380, cur: "USD", fx: 1450, pago: "Efectivo", nota: "Pagó en dólares" });
    d.gastos.push({ id: "gusd", type: "variable", concept: "Cerámico importado", amount: 120, cur: "USD", fx: 1450, date: addDays(t0, -6), rec: false, end: "" });
    var hs = ["09:00", "11:00", "14:00", "16:00"];
    for (var z = -3; z <= 9; z++) { var dd = addDays(t0, z); if (new Date(dd + "T12:00:00").getDay() === 0) continue; if (rnd() < .3) continue; var c = pick(d.clients), s = pick(["Lavado premium", "Limpieza de interior y lavado", "Preventa", "Tratamiento cerámico", "Abrillantado"]); d.turnos.push({ id: "t" + z, date: dd, time: pick(hs), cid: c.id, veh: rnd() < .4 ? "camioneta" : "auto", service: s, estado: z < 0 ? "hecho" : (z > 4 ? "pend" : "conf"), nota: "" }); }
    var up = d.turnos.filter(function (x) { return x.date > t0 && x.estado === "conf"; })[0], dn = d.turnos.filter(function (x) { return x.date < t0 && x.estado === "hecho"; })[0], dn2 = d.turnos.filter(function (x) { return x.date < t0 && x.estado === "hecho"; })[1];
    var cli = function (x) { return x.cid; };
    if (up) d.ingresos.push({ id: "isena1", date: addDays(up.date, -2), cid: cli(up), veh: up.veh, service: up.service, amount: SENA, tipo: "sena", tid: up.id, pago: "Transferencia", nota: "" });
    if (dn) d.ingresos.push({ id: "isena2", date: addDays(dn.date, -3), cid: cli(dn), veh: dn.veh, service: dn.service, amount: SENA, tipo: "sena", tid: dn.id, pago: "Transferencia", nota: "" });
    if (dn2) { d.ingresos.push({ id: "isena3", date: addDays(dn2.date, -3), cid: cli(dn2), veh: dn2.veh, service: dn2.service, amount: SENA, tipo: "sena", tid: dn2.id, pago: "Transferencia", nota: "" }); d.ingresos.push({ id: "isaldo3", date: dn2.date, cid: cli(dn2), veh: dn2.veh, service: dn2.service, amount: Math.max(0, priceOf(dn2.service, dn2.veh) - SENA), tipo: "saldo", tid: dn2.id, pago: "Efectivo", nota: "" }); }
    return d;
  }

  // ---------- exportar ----------
  function download(name, text, type) { var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
  function csvCell(v) { v = String(v == null ? "" : v); return /[",;\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function exportCsv() {
    var rows = [["Tipo", "Fecha", "Cliente", "Concepto o servicio", "Categoría", "Monto en pesos", "Medio de pago", "Moneda", "Monto original", "Cotización", "Tipo de cobro", "Turno"]];
    DB.ingresos.forEach(function (i) { var c = DB.clients.filter(function (x) { return x.id === i.cid; })[0]; rows.push(["Ingreso", i.date, c ? c.name : "", i.service, i.veh, ars(i), i.pago, i.cur === "USD" ? "USD" : "ARS", i.amount, i.cur === "USD" ? i.fx : "", TIPOS[i.tipo] || "Pago total", (turOf(i.tid) || {}).date || ""]); });
    DB.gastos.forEach(function (g) { rows.push(["Gasto", g.date, "", g.concept, TNAME[g.type] + (gFreq(g) !== "once" ? " (" + FREQ[gFreq(g)].toLowerCase() + ")" : ""), -ars(g), "", g.cur === "USD" ? "USD" : "ARS", g.amount, g.cur === "USD" ? g.fx : "", "", ""]); });
    download("rdetail-cobros-y-gastos.csv", "﻿" + rows.map(function (r) { return r.map(csvCell).join(";"); }).join("\n"), "text/csv");
  }

  // ---------- eventos ----------
  var A = {
    close: closeM,
    "add-ing": function () { formIng(null, { date: UI.month === curM() ? today() : UI.month + "-01", veh: "auto", service: "", pago: "Efectivo", amount: "" }); },

    "del-ing": function (id) { if (confirm("¿Borrar este cobro?")) { DB.ingresos = DB.ingresos.filter(function (x) { return x.id !== id; }); DB.follow = DB.follow.filter(function (f) { return f.iid !== id; }); save(); render(); } },
    "save-ing": function (id) { saveIng(id); },
    "add-gas": function () { formGas(null, "variable"); },
    "edit-gas": function (id) { formGas(DB.gastos.filter(function (x) { return x.id === id; })[0]); },
    "del-gas": function (id) { var g = DB.gastos.filter(function (x) { return x.id === id; })[0]; if (g && confirm(gFreq(g) !== "once" ? "Es un gasto que se repite (" + FREQ[gFreq(g)].toLowerCase() + "): se borra de todos los meses. ¿Seguro?" : "¿Borrar este gasto?")) { DB.gastos = DB.gastos.filter(function (x) { return x.id !== id; }); save(); render(); } },
    "save-gas": saveGas,
    "pick-day": function (d) { UI.day = d; render(); var e = document.querySelector(".sec + .sec"); if (e && window.matchMedia("(max-width:700px)").matches) e.scrollIntoView({ behavior: "smooth", block: "start" }); },
    "add-t-day": function (d) { formTur({ date: d || today(), time: "09:00", veh: "auto", service: "Lavado premium", estado: "pend" }); },
    "add-t": function () { formTur(); }, "t-edit": function (id) { formTur(DB.turnos.filter(function (x) { return x.id === id; })[0]); },
    "t-del": function (id) { if (confirm("¿Borrar este turno?")) { DB.turnos = DB.turnos.filter(function (x) { return x.id !== id; }); save(); render(); } },
    "t-conf": function (id) { DB.turnos.forEach(function (x) { if (x.id === id) x.estado = "conf"; }); save(); render(); toast("Turno confirmado"); },
    "t-sena": function (id) { var x = turOf(id); if (!x) return; formIng(null, { date: today(), veh: x.veh, service: x.service, pago: "Transferencia", amount: SENA, cid: x.cid, tid: x.id, tipo: "sena" }); },
    "t-saldo": function (id) { var x = turOf(id); if (!x) return; var p = turPay(x); formIng(null, { date: today(), veh: x.veh, service: x.service, pago: "Transferencia", amount: p.rest || "", cid: x.cid, tid: x.id, tipo: p.n ? "saldo" : "total" }); },
    "t-canc": function (id) { if (confirm("¿Cancelar este turno?")) { DB.turnos.forEach(function (x) { if (x.id === id) x.estado = "canc"; }); save(); render(); } },
    "t-hecho": function (id) { var x = turOf(id); if (!x) return; var p = turPay(x); formIng(null, { date: x.date <= today() ? x.date : today(), veh: x.veh, service: x.service, pago: "Transferencia", amount: p.rest || "", cid: x.cid, tid: x.id, tipo: p.n ? "saldo" : "total", done: true }); },
    "save-t": saveTur,
    "add-cli": function () { formCli(); }, "open-cli": openCli, "edit-cli": function (id) { formCli(DB.clients.filter(function (x) { return x.id === id; })[0]); },
    "del-cli": function (id) { if (confirm("¿Borrar este cliente? Sus cobros quedan registrados sin nombre.")) { DB.clients = DB.clients.filter(function (x) { return x.id !== id; }); DB.follow = DB.follow.filter(function (f) { return f.cid !== id; }); save(); closeM(); render(); } },
    "save-cli": saveCli,
    "add-ing-c": function (id) { var c = DB.clients.filter(function (x) { return x.id === id; })[0]; formIng(null, { date: today(), veh: "auto", service: "", pago: "Efectivo", amount: "", cid: id, name: c.name, phone: c.phone }); },
    "add-t-c": function (id) { var c = DB.clients.filter(function (x) { return x.id === id; })[0]; formTur({ date: today(), time: "09:00", veh: "auto", service: "Lavado premium", estado: "pend", cid: c.id }); },
    "add-fu": formFu, "save-fu": saveFu,

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act],[data-tab],[data-sub]"); if (!t) { if (e.target === $("ov")) closeM(); return; }

    if (e.target.id === "f-svc" || e.target.id === "f-veh") autoAmt(true);
    if (e.target.id === "f-tipo") autoAmt(true);

    if (e.target.id === "f-cur") { var u = e.target.value === "USD", lp = priceOf(gv("f-svc"), gv("f-veh")); if (u) { if (+$("f-amt").value === lp) $("f-amt").value = ""; if (!$("f-fx").value) $("f-fx").value = lastFx() || ""; } autoAmt(!u); conv("f"); }
    if (e.target.id === "g-cur") { setTimeout(gfreqUI, 0); if (e.target.value === "USD" && !$("g-fx").value) $("g-fx").value = lastFx() || ""; conv("g"); }

    if (e.target.id === "g-freq") gfreqUI();

    if (e.target.id === "f-phone" && !gv("f-name").trim()) { var cp = findByPhone(e.target.value); if (cp) $("f-name").value = cp.name; }
    if (e.target.id === "t-name") { var c2 = findClient(e.target.value); if (c2 && c2.phone && !$("t-phone").value) $("t-phone").value = c2.phone; }
  });

  var h = location.hash.replace("#", "");

  var sm = h.match(/-(seg|cal|tur|cli|rea)$/); if (sm) UI.sub = sm[1];
  $("lg-form").addEventListener("submit", doLogin);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && TOKEN && !DEMO) { flush().then(pull).then(function () { return syncCal(false); }); } });
  window.addEventListener("online", function () { flush(); });
  window.addEventListener("offline", function () { setStatus("off"); });
  setInterval(function () { if (!document.hidden && TOKEN && !DEMO && !modalOpen()) pull(); }, 90000);
  if (DEMO) { DB = seedDemo(); $("login").hidden = true; render(); setStatus("ok"); }
  else boot();
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
